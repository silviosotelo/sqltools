[package]
name = "sqlt-app"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"

[dependencies]
keyring = "4.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlt-core = { path = "../sqlt-core" }
sqlt-meta = { path = "../sqlt-meta" }
sqlt-oracle = { path = "../sqlt-oracle" }
ureq = { version = "2", default-features = false, features = ["tls", "json"] }
