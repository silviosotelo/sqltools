[package]
name = "sqlt-desktop"
version = "0.1.1"
edition = "2021"
license = "GPL-3.0-only"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlt-app = { path = "../crates/sqlt-app" }
sqlt-core = { path = "../crates/sqlt-core" }
sqlt-meta = { path = "../crates/sqlt-meta" }
sqlt-oracle = { path = "../crates/sqlt-oracle" }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
