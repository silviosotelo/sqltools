name: Rust CI

on:
  push:
    branches: [rust]
    tags: ["v*"]
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, ubuntu-22.04]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude sqlt-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude sqlt-desktop

  tauri-check:
    name: tauri check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/web/package-lock.json
      - name: Dependencias de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefix rust/web
      - run: npm --prefix rust/web run build
      - run: npm --prefix rust/web test
      - run: cargo check -p sqlt-desktop
        working-directory: rust

  bundle:
    name: bundle (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-15-intel, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/web/package-lock.json
      - name: Tauri dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev patchelf
      - run: npm ci --prefix rust/web
      - run: npm --prefix rust/web run build
      # The Linux AppImage step downloads AppRun from GitHub; a reset there
      # failed the job even though deb/rpm were already built.
      # Missing secrets resolve to empty strings; exporting them makes Tauri try
      # to import an empty certificate (macOS bundle failed that way). Export
      # only the secrets that are actually configured.
      - name: Configure optional signing
        shell: bash
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          write_env() {
            local name="$1" value="$2" delimiter
            [ -n "$value" ] || return 0
            if [[ "$value" == *$'\n'* ]]; then
              delimiter="EOF_${RANDOM}${RANDOM}${RANDOM}"
              {
                printf '%s<<%s\n' "$name" "$delimiter"
                printf '%s\n' "$value"
                printf '%s\n' "$delimiter"
              } >> "$GITHUB_ENV"
            else
              printf '%s=%s\n' "$name" "$value" >> "$GITHUB_ENV"
            fi
          }
          write_env TAURI_SIGNING_PRIVATE_KEY "${TAURI_SIGNING_PRIVATE_KEY:-}"
          write_env TAURI_SIGNING_PRIVATE_KEY_PASSWORD "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}"
          write_env APPLE_CERTIFICATE "${APPLE_CERTIFICATE:-}"
          write_env APPLE_CERTIFICATE_PASSWORD "${APPLE_CERTIFICATE_PASSWORD:-}"
          write_env APPLE_SIGNING_IDENTITY "${APPLE_SIGNING_IDENTITY:-}"
          write_env APPLE_ID "${APPLE_ID:-}"
          write_env APPLE_PASSWORD "${APPLE_PASSWORD:-}"
          write_env APPLE_TEAM_ID "${APPLE_TEAM_ID:-}"
      - name: Self-sign the macOS bundle (ad-hoc)
        if: runner.os == 'macOS'
        timeout-minutes: 5
        shell: bash
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [ -n "${APPLE_SIGNING_IDENTITY:-}" ]; then
            echo "Apple identity configured; skipping the ad-hoc signature"
            exit 0
          fi
          # A self-signed certificate in a temporary keychain made `codesign`
          # wait forever for a private-key access prompt on the runner (40
          # minutes, twice). An ad-hoc identity ("-") is what a self-signed
          # macOS build amounts to (Gatekeeper rejects both), needs no keychain
          # and is accepted by `codesign --verify`.
          echo "APPLE_SIGNING_IDENTITY=-" >> "$GITHUB_ENV"
      - name: Create a self-signed certificate (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
        run: |
          if ($env:WINDOWS_CERTIFICATE) {
            "Windows certificate configured; skipping the self-signed certificate"
            exit 0
          }
          $cert = New-SelfSignedCertificate -Type CodeSigningCert `
            -Subject "CN=SQLTools Self-Signed" -CertStoreLocation Cert:\CurrentUser\My `
            -KeyUsage DigitalSignature -KeyExportPolicy Exportable `
            -NotAfter (Get-Date).AddYears(3) -FriendlyName "SQLTools Self-Signed"
          $config = @{
            bundle = @{ windows = @{ certificateThumbprint = $cert.Thumbprint } }
          } | ConvertTo-Json -Depth 5
          $config | Set-Content "$env:RUNNER_TEMP\sqlt-sign.json" -Encoding ascii
          "SQLT_SIGN_CONFIG=$env:RUNNER_TEMP\sqlt-sign.json" >> $env:GITHUB_ENV
          "SQLT_THUMBPRINT=$($cert.Thumbprint)" >> $env:GITHUB_ENV
          "SQLT_SELF_SIGN=1" >> $env:GITHUB_ENV
          Get-ChildItem Cert:\CurrentUser\My -CodeSigningCert | Select-Object Subject, Thumbprint
      - name: Build bundles
        timeout-minutes: 30
        shell: bash
        working-directory: rust/desktop
        run: |
          # Updater artifacts need the private key; without it (fork PRs) disable
          # them instead of failing the whole bundle job.
          config_args=()
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            config_args=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          if [ -n "${SQLT_SIGN_CONFIG:-}" ]; then
            config_args+=(--config "$SQLT_SIGN_CONFIG")
          fi
          build_args=(build)
          if [ -n "${SQLT_SELF_SIGN:-}" ]; then
            # The installer embeds the app binary, so sign it before bundling.
            build_args+=(--no-bundle)
          fi
          for attempt in 1 2 3; do
            npx --yes @tauri-apps/cli@^2 "${build_args[@]}" "${config_args[@]}" && exit 0
            echo "tauri build failed (attempt $attempt); retrying in 15s"
            sleep 15
          done
          exit 1
      - name: Sign the Windows app binary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not $env:SQLT_SELF_SIGN) { "No self-signed certificate; skipping"; exit 0 }
          $signtool = (Get-Command signtool.exe -ErrorAction SilentlyContinue).Source
          if (-not $signtool) {
            $signtool = Get-ChildItem "C:\Program Files (x86)\Windows Kits\10\bin" -Recurse -Filter signtool.exe |
              Where-Object { $_.FullName -match '\\x64\\' } | Select-Object -First 1 -ExpandProperty FullName
          }
          & $signtool sign /sha1 "$env:SQLT_THUMBPRINT" /fd SHA256 /d SQLTools `
            /du https://github.com/silviosotelo/sqltools rust/target/release/sqlt-desktop.exe
          Get-AuthenticodeSignature rust/target/release/sqlt-desktop.exe |
            Select-Object Status, @{ n = "Signer"; e = { $_.SignerCertificate.Subject } }
      - name: Bundle with the self-signed certificate (Windows)
        if: runner.os == 'Windows'
        shell: bash
        working-directory: rust/desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "${SQLT_SELF_SIGN:-}" ]; then
            echo "No self-signed certificate; the build already produced the bundles"
            exit 0
          fi
          config_args=(--config "$SQLT_SIGN_CONFIG")
          if [ -z "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            config_args+=(--config '{"bundle":{"createUpdaterArtifacts":false}}')
          fi
          npx --yes @tauri-apps/cli@^2 bundle "${config_args[@]}"
      - name: Verify the Windows signatures
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $missing = 0
          Get-ChildItem rust/target/release/bundle -Recurse -Include *.exe,*.msi | ForEach-Object {
            $sig = Get-AuthenticodeSignature $_.FullName
            "{0}: {1} ({2})" -f $_.Name, $sig.Status, $sig.SignerCertificate.Subject
            if (-not $sig.SignerCertificate) { $missing++ }
          }
          if ($missing -gt 0) { throw "$missing Windows artifacts are unsigned" }
      - name: Verify the macOS signature
        if: runner.os == 'macOS'
        shell: bash
        run: |
          APP=$(find rust/target/release/bundle/macos -maxdepth 1 -name '*.app' | head -n 1)
          test -n "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=2 "$APP" 2>&1 | grep -E 'Identifier|Authority|TeamIdentifier' || true
          spctl --assess --type execute "$APP" 2>&1 || true
      - uses: actions/upload-artifact@v4
        with:
          name: sqltools-${{ matrix.os }}
          path: rust/target/release/bundle/**/*
          if-no-files-found: error

  # Publishes the tag: bundles, their .sig files and the updater feed
  # `latest.json` that `tauri.conf.json` points at. Runs only for v* tags.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: bundle
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: sqltools-*
          merge-multiple: true
          path: dist
      - name: Build latest.json
        shell: bash
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          config=$(python3 -c "import json;print(json.load(open('rust/desktop/tauri.conf.json'))['version'])")
          if [ "$version" != "$config" ]; then
            echo "tag $TAG does not match tauri.conf.json version $config" >&2
            exit 1
          fi
          python3 - <<'PY'
          import datetime, json, os, pathlib
          version = os.environ["TAG"][1:]
          tag = os.environ["TAG"]
          repo = os.environ["REPO"]
          platforms = {}
          for sig in pathlib.Path("dist").rglob("*.sig"):
              name = sig.with_suffix("").name
              if name.endswith("-setup.exe"):
                  key = "windows-x86_64"
              elif name.endswith(".app.tar.gz"):
                  key = "darwin-x86_64"
              elif name.endswith(".AppImage"):
                  key = "linux-x86_64"
              else:
                  continue
              platforms[key] = {
                  "signature": sig.read_text().strip(),
                  "url": f"https://github.com/{repo}/releases/download/{tag}/{name}",
              }
          if not platforms:
              raise SystemExit("no signed bundles found in dist/")
          payload = {
              "version": version,
              "notes": f"SQLTools {version}",
              "pub_date": datetime.datetime.now(datetime.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "platforms": platforms,
          }
          pathlib.Path("latest.json").write_text(json.dumps(payload, indent=2))
          print(json.dumps(payload, indent=2))
          PY
      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          files=$(find dist -type f \( -name '*.msi' -o -name '*-setup.exe' -o -name '*.dmg' \
            -o -name '*.app.tar.gz' -o -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \
            -o -name '*.sig' \))
          gh release create "$GITHUB_REF_NAME" $files latest.json \
            --title "SQLTools $GITHUB_REF_NAME" --generate-notes ||
          gh release upload "$GITHUB_REF_NAME" $files latest.json --clobber
