name: Rust CI

on:
  push:
    branches: [rust]
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"
  pull_request:
    paths:
      - "rust/**"
      - ".github/workflows/rust-ci.yml"

concurrency:
  group: rust-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, macos-latest-intel, ubuntu-22.04]
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude sqlt-desktop --all-targets -- -D warnings
      - run: cargo test --workspace --exclude sqlt-desktop

  tauri-check:
    name: tauri check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-22.04]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/web/package-lock.json
      - name: Dependencias de Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - run: npm ci --prefix rust/web
      - run: npm --prefix rust/web run build
      - run: cargo check -p sqlt-desktop
        working-directory: rust

  bundle-windows:
    name: bundle (windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: rust/web/package-lock.json
      - run: npm ci --prefix rust/web
      - run: npm --prefix rust/web run build
      - run: npx --yes @tauri-apps/cli@^2 build
        working-directory: rust/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: sqltools-windows
          path: |
            rust/target/release/bundle/msi/*.msi
            rust/target/release/bundle/nsis/*.exe
          if-no-files-found: error
